<!doctype html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ topic }} — Research Pipeline</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 2rem; background: #0f0f1a; }
    .card { background: #1a1a2e; border: 1px solid #2a2a4a; }
    .card-header { background: #16162b; border-bottom: 1px solid #2a2a4a; }
    .btn-primary { background: #6c5ce7; border-color: #6c5ce7; }
    .btn-primary:hover { background: #5a4bd1; border-color: #5a4bd1; }
    .btn-outline-light { border-color: #2a2a4a; color: #aaa; }
    .btn-outline-light:hover { background: #2a2a4a; border-color: #3a3a5a; color: #eee; }
    code { background: #12122a; color: #a8a8ff; padding: 0.2em 0.4em; border-radius: 4px; }
    pre { background: #12122a; border: 1px solid #2a2a4a; border-radius: 8px; padding: 1rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { border: 1px solid #2a2a4a; padding: 0.5rem; }
    th { background: #16162b; color: #a8a8ff; }
    tr:nth-child(even) { background: #16162b; }
    a { color: #6c5ce7; }
    a:hover { color: #a8a8ff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 style="color: #a8a8ff;">{{ topic }}</h2>
      <div>
        {% for f in files %}
          <a href="/raw/{{ slug }}/{{ f }}" class="btn btn-outline-light btn-sm me-1">&#x1f4c4; {{ f }}</a>
        {% endfor %}
        <a href="/chat/{{ slug }}" class="btn btn-outline-light btn-sm me-1">&#x1f4ac; Chat</a>
        <a href="/" class="btn btn-primary btn-sm ms-2">&larr; Indietro</a>
      </div>
    </div>

    <div class="card">
      <div class="card-body" style="color: #ddd; line-height: 1.7;">
        {{ html_body | safe }}
      </div>
    </div>

    <p class="text-center text-secondary mt-4 small">
      <a href="/raw/{{ slug }}/results.md" class="text-secondary">Vedi markdown grezzo</a>
      &middot;
      <a href="/raw/{{ slug }}/results.pdf" class="text-secondary">Scarica PDF</a>
    </p>
  </div>
</body>
</html>
