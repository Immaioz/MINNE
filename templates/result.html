<!doctype html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ topic }} — MINNE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/static/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-custom">
    <div class="container">
      <a class="navbar-brand" href="/">&#x2697; MINNE</a>
      <div class="d-flex align-items-center gap-2">
        <span class="text-secondary" style="font-size:0.8rem;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ topic }}</span>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row">

      <!-- TOC sidebar -->
      <div class="col-lg-3 d-none d-lg-block">
        <div class="toc-sidebar" id="toc"></div>
      </div>

      <!-- Main content -->
      <div class="col-lg-9">

        <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
          <h4 style="color:var(--accent);font-weight:600;margin:0;">{{ topic }}</h4>
          <div class="d-flex gap-1 flex-wrap">
            {% for f in files %}
              <a href="/raw/{{ slug }}/{{ f }}" class="btn-ghost btn-sm">
                &#128196; {{ f }}
              </a>
            {% endfor %}
            <a href="/chat/{{ slug }}" class="btn-accent btn-sm">
              &#128172; Chat
            </a>
            <a href="/" class="btn-ghost btn-sm">&#8592; Indietro</a>
          </div>
        </div>

        <div class="card-custom">
          <div class="card-body result-content" id="resultContent">
            {{ html_body | safe }}
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
          <div class="text-secondary small">
            <a href="/raw/{{ slug }}/results.md" class="text-secondary me-2">Vedi markdown grezzo</a>
            &middot;
            <a href="/raw/{{ slug }}/results.pdf" class="text-secondary ms-2">Scarica PDF</a>
          </div>
          <button id="backToTop" class="btn-ghost btn-sm" style="display:none;">&#8593; Torna su</button>
        </div>

      </div>
    </div>
  </div>

  <script>
    // ─── TOC generation ──────────────────────────────────────────────
    const content = document.getElementById('resultContent');
    const toc = document.getElementById('toc');

    if (content && toc) {
      const headings = content.querySelectorAll('h1, h2, h3');
      if (headings.length > 0) {
        let html = '<div class="text-secondary small mb-2" style="font-weight:600;">Indice</div>';
        headings.forEach(h => {
          const level = parseInt(h.tagName[1]);
          if (!h.id) {
            h.id = 'section-' + Math.random().toString(36).slice(2, 8);
          }
          html += `<a href="#${h.id}" class="level-${level}">${h.textContent}</a>`;
        });
        toc.innerHTML = html;

        // Active TOC item on scroll
        const links = toc.querySelectorAll('a');
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              links.forEach(l => l.classList.remove('active'));
              const link = toc.querySelector(`a[href="#${entry.target.id}"]`);
              if (link) link.classList.add('active');
            }
          });
        }, { rootMargin: '-80px 0px -60% 0px' });
        headings.forEach(h => observer.observe(h));
      }
    }

    // ─── Back to top ───────────────────────────────────────────────
    const backBtn = document.getElementById('backToTop');
    window.addEventListener('scroll', () => {
      backBtn.style.display = window.scrollY > 500 ? 'block' : 'none';
    });
    backBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // ─── Wrap tables for horizontal scroll ─────────────────────────
    document.querySelectorAll('.result-content table').forEach(t => {
      if (!t.parentNode.classList.contains('table-wrapper')) {
        const wrapper = document.createElement('div');
        wrapper.className = 'table-wrapper';
        t.parentNode.insertBefore(wrapper, t);
        wrapper.appendChild(t);
      }
    });
  </script>
</body>
</html>
