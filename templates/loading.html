<!doctype html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In esecuzione — {{ topic }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 2rem; background: #0f0f1a; }
    h2 { color: #a8a8ff; }
    .log-box {
      background: #0a0a14;
      border: 1px solid #2a2a4a;
      border-radius: 8px;
      padding: 1rem;
      font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
      font-size: 0.8rem;
      line-height: 1.5;
      color: #b0b0d0;
      max-height: 70vh;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      text-align: left;
    }
    .log-box .highlight { color: #6c5ce7; font-weight: bold; }
    .log-box .success { color: #00d68f; }
    .log-box .error { color: #ff6b6b; }
    .log-box .info { color: #5dade2; }
    .badge-status {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      background: #2a2a4a;
      color: #a8a8ff;
    }
    .badge-status.running { background: #6c5ce722; color: #6c5ce7; }
    .badge-status.done { background: #00d68f22; color: #00d68f; }
    .badge-status.error { background: #ff6b6b22; color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 style="font-size: 1.4rem;">&#x2697; Pipeline in esecuzione</h2>
      <span id="statusBadge" class="badge-status running">⏳ In esecuzione</span>
    </div>
    <p class="text-secondary mb-3" style="font-size: 0.95rem;">{{ topic }}</p>

    <div id="logBox" class="log-box mb-3">
      Avvio della pipeline in corso…
    </div>

    <p class="text-secondary small text-center">
      <span id="lineCount">0</span> righe · aggiornamento ogni 2s
    </p>
  </div>

  <script>
    const slug = "{{ slug }}";
    const logBox = document.getElementById('logBox');
    const statusBadge = document.getElementById('statusBadge');
    const lineCount = document.getElementById('lineCount');
    let autoScroll = true;

    logBox.addEventListener('scroll', () => {
      const atBottom = logBox.scrollHeight - logBox.scrollTop - logBox.clientHeight < 40;
      autoScroll = atBottom;
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function highlight(text) {
      return text
        .replace(/(✓|✅)/g, '<span class="success">$1</span>')
        .replace(/(✗|⚠️)/g, '<span class="error">$1</span>')
        .replace(/(📋|📌|🤖|📊|✍️|💡|📚|📥|💾)/g, '<span class="info">$1</span>')
        .replace(/(VERIFIED|OK|done|completata)/gi, '<span class="success">$1</span>')
        .replace(/(error|fail|not|non|mancante|fallito)/gi, '<span class="error">$1</span>');
    }

    function pollOutput() {
      fetch(`/output/${slug}`).then(r => r.text()).then(text => {
        if (text) {
          const lines = text.split('\n');
          lineCount.textContent = lines.length;
          logBox.innerHTML = highlight(escapeHtml(text));
          if (autoScroll) {
            logBox.scrollTop = logBox.scrollHeight;
          }
        }
      }).catch(() => {});
    }

    function pollStatus() {
      fetch(`/check/${slug}`).then(r => r.json()).then(data => {
        if (data.status === 'done') {
          statusBadge.className = 'badge-status done';
          statusBadge.textContent = '✅ Completato';
          // one last output fetch then redirect
          setTimeout(() => { pollOutput(); }, 500);
          setTimeout(() => { window.location.href = `/result/${slug}`; }, 2000);
        } else if (data.status === 'error') {
          statusBadge.className = 'badge-status error';
          statusBadge.textContent = '❌ Errore';
          setTimeout(() => { pollOutput(); }, 500);
          setTimeout(() => { window.location.href = '/'; }, 5000);
        } else if (data.status === 'running') {
          setTimeout(pollStatus, 2000);
        } else {
          setTimeout(() => { window.location.href = '/'; }, 3000);
        }
      }).catch(() => { setTimeout(pollStatus, 3000); });
    }

    // poll output every 2s, status every 2s
    setInterval(pollOutput, 2000);
    setTimeout(pollStatus, 2000);
    setTimeout(pollOutput, 500);
  </script>
</body>
</html>
