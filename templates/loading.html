<!doctype html>
<html lang="it" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>In esecuzione — {{ topic }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding-top: 4rem; background: #0f0f1a; text-align: center; }
    .spinner { width: 4rem; height: 4rem; border: 4px solid #2a2a4a; border-top-color: #6c5ce7; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 2rem auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { color: #a8a8ff; }
  </style>
</head>
<body>
  <div class="container">
    <h2>&#x2697; Pipeline in esecuzione</h2>
    <p class="text-secondary" style="font-size: 1.1rem;">{{ topic }}</p>
    <div class="spinner"></div>
    <p class="text-secondary">Attendi il completamento... (fino a 30 minuti)</p>
    <div id="status" class="text-secondary small"></div>
  </div>

  <script>
    const slug = "{{ slug }}";
    function poll() {
      fetch(`/check/${slug}`).then(r => r.json()).then(data => {
        const statusEl = document.getElementById('status');
        if (data.status === 'done') {
          statusEl.textContent = 'Completato! Reindirizzamento...';
          window.location.href = `/result/${slug}`;
        } else if (data.status === 'error') {
          statusEl.textContent = 'Errore durante la pipeline.';
          statusEl.style.color = '#f66';
          setTimeout(() => { window.location.href = '/'; }, 4000);
        } else if (data.status === 'running') {
          statusEl.textContent = 'In esecuzione...';
          setTimeout(poll, 3000);
        } else {
          statusEl.textContent = 'Job non trovato.';
          setTimeout(() => { window.location.href = '/'; }, 3000);
        }
      }).catch(() => { setTimeout(poll, 3000); });
    }
    setTimeout(poll, 2000);
  </script>
</body>
</html>
